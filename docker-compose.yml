services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: usuario
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"   # 5433 no host para não colidir com o Postgres da biblioteca (5432)
    volumes:
      - pgdata_usuario:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/usuario
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Mesmo valor nos dois serviços. Vem do arquivo .env (veja .env.example)
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      # Origem do React (só necessário se o application.properties tiver cors.allowed-origins)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      - db

volumes:
  pgdata_usuario:
